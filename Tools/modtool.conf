# SloppyMods Riimba - the only file in Tools/ that differs between mods.
# Everything else here is shared verbatim across the SloppyMod repos.

name      = SloppyMods Riimba
folder    = SloppyModsRiimba
namespace = RiimbaMod
assembly  = RiimbaMod
source    = Source/RiimbaMod
series    = 0.9

# defNames this mod owns. Lets the validator tell "a reference of ours that
# matches nothing" (a typo) from "a reference to a vanilla def".
prefix    = Riimba

# <output dir> <RimWorld ref version> [compile-time defines]
build     = Assemblies 1.6.4871

# Must be in the release zip.
require   = LICENSE
require   = About/About.xml
require   = Defs
require   = Languages
require   = Textures
